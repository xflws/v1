org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# Several plugins (flutter_tts among them) compile Java at 11 while Kotlin
# defaults higher. The mismatch is harmless — a class file targeting 11 runs
# perfectly well beside one targeting 17 — and Gradle refusing to build over it
# is the only real problem. This downgrades it to a warning.
#
# The alternative, forcing both targets from the root build file, is what broke
# the Android SDK classpath in an earlier attempt. Leave the plugins alone.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
