# Codemagic CI/CD configuration for XFLWS Flutter app
# 
# To use:
# 1. Push this repo to GitHub/GitLab/Bitbucket
# 2. Connect the repo at https://codemagic.io
# 3. Add these environment variables in Codemagic:
#    - APP_STORE_CONNECT_ISSUER_ID   (App Store Connect API key issuer ID)
#    - APP_STORE_CONNECT_KEY_ID      (App Store Connect API key ID)
#    - APP_STORE_CONNECT_PRIVATE_KEY (App Store Connect API private key content)
#    - DASHSCOPE_API_KEY             (your DashScope API key)
#
# For testing only (no App Store): remove the 'app_store_connect' section
# and Codemagic will produce an .ipa for ad-hoc distribution instead.

workflows:
  ios-ipa:
    name: XFLWS iOS IPA
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        XFLWS_API_URL: https://xerp.xflws.com
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up code signing
        script: |
          # Create a temporary keychain for signing
          keychain initialize

          # Fetch signing certificate and provisioning profile
          # (uses App Store Connect API credentials from env vars)
          keychain add-certificates
          xcode-project use-profiles

      - name: Fetch Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --dart-define=XFLWS_API=$XFLWS_API_URL \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcode_build_logs.zip
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
      # Uncomment below to auto-publish to TestFlight
      # app_store_connect:
      #   api_key: $APP_STORE_CONNECT_PRIVATE_KEY
      #   key_id: $APP_STORE_CONNECT_KEY_ID
      #   issuer_id: $APP_STORE_CONNECT_ISSUER_ID
