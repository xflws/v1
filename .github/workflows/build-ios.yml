name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS IPA (unsigned)
        run: |
          flutter build ipa \
            --release \
            --no-codesign \
            --dart-define=XFLWS_API=https://xerp.xflws.com

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xflws-unsigned-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
